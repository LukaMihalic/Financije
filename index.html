<style>
:root{--bg:#f4f6f5;--card:#fff;--text:#16211f;--muted:#6b7a77;--line:#e3e8e6;--acc:#0f766e;--onacc:#fff;--acc2:#ccfbf1;--pos:#15803d;--neg:#c2410c;--warn:#fef3c7;--warnt:#92400e}
@media (prefers-color-scheme:dark){:root{--bg:#0e1514;--card:#17201f;--text:#e7eeec;--muted:#93a39f;--line:#26312f;--acc:#2dd4bf;--onacc:#06201d;--acc2:#134e4a;--pos:#4ade80;--neg:#fb923c;--warn:#422006;--warnt:#fde68a}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
#topbar{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:calc(8px + env(safe-area-inset-top)) 16px 8px;max-width:640px;margin:0 auto}
#topbar button{background:none;border:0;color:var(--acc);font-size:30px;width:44px;height:44px;cursor:pointer}
#topbar button.off{visibility:hidden}
#monthLabel{font-weight:700;font-size:18px}
#app{max-width:640px;margin:0 auto;padding:0 16px calc(110px + env(safe-area-inset-bottom))}
.card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.card h3{margin:0 0 10px;font-size:16px}
.card p{margin:6px 0}
.summary{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{display:flex;flex-direction:column;gap:4px}.stat b{font-size:20px}.stat.big b{font-size:28px}
.pos{color:var(--pos)}.neg{color:var(--neg)}.muted{color:var(--muted)}.small{font-size:13px}.center{text-align:center}
.warn{background:var(--warn);color:var(--warnt)}
.bar-row{margin:10px 0}
.bar-label{display:flex;justify-content:space-between;gap:8px;font-size:14px;margin-bottom:5px}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);border-radius:4px}
.bar.near i{background:#d97706}.bar.over i{background:#dc2626}
.day{font-size:13px;color:var(--muted);font-weight:600;margin:14px 0 2px}
.list .day:first-child{margin-top:0}
.tx{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.tx:last-child{border-bottom:0}
.ic{font-size:21px;width:38px;height:38px;display:grid;place-items:center;background:var(--bg);border-radius:10px;flex:none}
.tx-main{flex:1;min-width:0}.tx-main div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx b{white-space:nowrap}
.tag{font-size:11px;background:var(--acc2);color:var(--acc);padding:1px 6px;border-radius:6px;vertical-align:middle}
.brow{padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}.brow:last-child{border-bottom:0}
.row-btn{padding:14px 2px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;justify-content:space-between;gap:8px}
.row-btn:last-child{border-bottom:0}
.btn{display:block;width:100%;padding:13px;border:0;border-radius:12px;font:inherit;font-weight:600;cursor:pointer;margin-top:12px;background:var(--line);color:var(--text)}
.btn.primary{background:var(--acc);color:var(--onacc)}
.btn.danger{background:none;color:#dc2626}
.btn.link{background:none;color:var(--acc);font-weight:500}
.btn.small{width:auto;display:inline-block;padding:8px 14px;font-size:14px}
.btn.back{width:auto;padding:4px 0;margin:0 0 8px;text-align:left}
.btn:disabled{opacity:.6}
label{display:block;font-size:14px;color:var(--muted);margin-top:12px}
input,select{display:block;width:100%;margin-top:4px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);font:inherit;font-size:16px}
input.amount{font-size:32px;font-weight:700;text-align:center;margin-top:4px}
label.switch{display:flex;align-items:center;gap:10px;color:var(--text)}
label.switch input{width:22px;height:22px;margin:0;flex:none}
.seg{display:flex;background:var(--line);border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;padding:9px;border-radius:9px;font:inherit;color:var(--text);cursor:pointer}
.seg button.on{background:var(--card);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.1)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:20px;padding:7px 12px;font:inherit;font-size:14px;cursor:pointer}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
#nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 0 calc(6px + env(safe-area-inset-bottom));z-index:6}
#nav button{background:none;border:0;color:var(--muted);font:inherit;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;flex:1;min-width:0;cursor:pointer}
#nav button span{font-size:22px}
#nav button.on{color:var(--acc);font-weight:600}
#nav .gap{width:66px}
#fab{position:fixed;right:max(16px,calc(50% - 304px));bottom:calc(74px + env(safe-area-inset-bottom));width:60px;height:60px;border-radius:50%;border:0;background:var(--acc);color:var(--onacc);font-size:34px;line-height:1;box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:7;cursor:pointer}
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:10;display:flex;align-items:flex-end;justify-content:center}
#sheet{background:var(--card);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:8px 16px calc(20px + env(safe-area-inset-bottom))}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
#sheet h2{margin:4px 0 14px;font-size:20px}
#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:20;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.act{pointer-events:auto;display:flex;align-items:center;gap:12px}
.toast-btn{background:none;border:0;color:var(--acc2);font:inherit;font-weight:700;cursor:pointer;padding:4px}
@media (prefers-color-scheme:light){.toast-btn{color:#5eead4}}
.fav-row{margin:0 0 10px}.fav-row .chip b{font-weight:600}
/* grafovi */
:root{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--s7:#6250d6;--sx:#a8aba9}
@media (prefers-color-scheme:dark){:root{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--s7:#9085e9;--sx:#5f6866}}
.seg-sm button{padding:7px 4px;font-size:14px}
svg text{font-family:inherit}
.t-ax{fill:var(--muted);font-size:11px}.t-cur{fill:var(--text);font-weight:700}
.t-val{fill:var(--text);font-size:11px;font-weight:600;paint-order:stroke;stroke:var(--card);stroke-width:3px;stroke-linejoin:round}
.t-big{fill:var(--text);font-size:18px;font-weight:700}
.grid{stroke:var(--line);stroke-width:1}
.ref{stroke:var(--text);stroke-width:1.5;stroke-dasharray:5 4;opacity:.7}
.hit{fill:transparent;cursor:pointer}.hit:hover{fill:var(--text);opacity:.06}
.mark{cursor:pointer}.mark:hover{opacity:.85}
.click{cursor:pointer}
.legend{margin-top:10px}
.legend.inline{display:flex;gap:16px;margin:0 0 6px;font-size:13px;color:var(--muted)}
.legend.inline span{display:flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;flex:none}
.lg-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.lg-row:last-child{border-bottom:0}
.lg-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acc-mini{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:10px;font-size:14px;color:var(--muted)}
.acc-mini b{color:var(--text);font-weight:600}
.acc-mini.joint{border-top:1px solid var(--line);padding-top:8px}
.acc-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.chip.sm{padding:5px 10px;font-size:13px}
.lbl{font-size:14px;color:var(--muted);margin-top:14px}
.st-row{display:grid;grid-template-columns:1fr 78px 92px;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.st-row:last-child{border-bottom:0}.st-row>span:not(:first-child){text-align:right}
.st-row .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st-head{font-size:12px;color:var(--muted);padding-top:0}
.tile-sub{font-size:12px;color:var(--muted)}
.partial{opacity:.45}
.imp-row{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.imp-row:last-child{border-bottom:0}.imp-row.off{opacity:.5}
.imp-row input[type=checkbox]{width:20px;height:20px;margin:2px 0 0;flex:none}
.imp-main{flex:1;min-width:0}.imp-main select{margin-top:6px;padding:8px;font-size:14px}
.imp-top{display:flex;gap:8px;justify-content:space-between;font-size:14px}
.imp-top .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.imp-row.nocat select{border-color:#d97706}
.dup{color:var(--warnt);background:var(--warn);padding:0 5px;border-radius:5px}
.filters input[type=search]{margin-top:0}
.flt-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.flt-row select{flex:1;min-width:120px;margin-top:0;padding:9px;font-size:14px}
.year-nav{display:flex;align-items:center;justify-content:space-between;padding:6px 12px}.year-nav .btn{width:auto;margin:0}
.scan-row{display:grid;grid-template-columns:1.4fr 1fr;gap:8px;margin-bottom:4px}.scan-row .btn{margin:0;font-size:14px;padding:11px 6px}
.ai-items{max-height:45vh;overflow:auto;margin-top:6px;border:1px solid var(--line);border-radius:12px;padding:0 10px}
.ai-it{padding:8px 0;border-bottom:1px solid var(--line)}.ai-it:last-child{border-bottom:0}
.ai-it select{margin-top:5px;padding:7px;font-size:14px}
.ai-saved{margin:10px 0 0;padding:8px 12px;border:1px solid var(--line);border-radius:12px}
.ai-saved summary{cursor:pointer;font-size:14px;font-weight:600}.ai-saved .imp-top{padding:5px 0;border-bottom:1px solid var(--line)}
.spinner{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--acc);border-radius:50%;margin:20px auto;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#tip{position:fixed;display:none;pointer-events:none;background:var(--text);color:var(--bg);padding:7px 10px;border-radius:8px;font-size:13px;line-height:1.35;white-space:pre-line;z-index:30;max-width:240px;box-shadow:0 4px 12px rgba(0,0,0,.2)}
.auth{margin-top:10vh;text-align:center}.auth label{text-align:left}
.logo{font-size:52px}.auth h1{margin:4px 0}
.code{font-size:30px;font-weight:700;letter-spacing:5px;text-align:center;padding:12px;background:var(--bg);border-radius:12px;margin:6px 0;cursor:pointer}
.msg{min-height:1em;margin-top:12px}
#reader{width:100%;border-radius:14px;overflow:hidden;background:#000;min-height:240px}
#reader video{border-radius:14px}
.btn.scan{background:var(--acc2);color:var(--acc);margin:0 0 4px}
label.btn{text-align:center;font-size:16px}
</style>
</head>
<body>
<div id="topbar" hidden>
  <button id="prevM" onclick="changeMonth(-1)" aria-label="Prethodni mjesec">‹</button>
  <div id="monthLabel"></div>
  <button id="nextM" onclick="changeMonth(1)" aria-label="Sljedeći mjesec">›</button>
</div>
<div id="app"><p class="center muted">Učitavam…</p></div>
<nav id="nav" hidden>
  <button data-tab="pregled" onclick="go('pregled')"><span>📊</span>Pregled</button>
  <button data-tab="stat" onclick="go('stat')"><span>📈</span>Statistika</button>
  <button data-tab="tx" onclick="go('tx')"><span>📋</span>Unosi</button>
  <button data-tab="budzet" onclick="go('budzet')"><span>🎯</span>Budžet</button>
  <button data-tab="vise" onclick="go('vise')"><span>⚙️</span>Više</button>
</nav>
<button id="fab" hidden onclick="openNew()" aria-label="Novi unos">+</button>
<div id="overlay" hidden onclick="if(event.target===this)closeSheet()"><div id="sheet"></div></div>
<div id="toast"></div>

<script>
// =====================================================================
//  OVDJE ZALIJEPI PODATKE IZ SVOG SUPABASE PROJEKTA "Financije"
//  (Project Settings -> API: Project URL i anon/public key)
// =====================================================================
const SUPABASE_URL = 'https://qkeepkdoqjibuuudlchk.supabase.co';
const SUPABASE_KEY = 'sb_publishable_CI5Ou8vMT-Rk87g45lWg_g_wXAIR9Jb';
// =====================================================================

const VERSION = 'v12.3';
const MONTHS = ['Siječanj','Veljača','Ožujak','Travanj','Svibanj','Lipanj','Srpanj','Kolovoz','Rujan','Listopad','Studeni','Prosinac'];
const DAYS = ['Nedjelja','Ponedjeljak','Utorak','Srijeda','Četvrtak','Petak','Subota'];
const eur = new Intl.NumberFormat('hr-HR', {style:'currency', currency:'EUR'});
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const ymKey = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}`;

function parseAmount(s){
  s = String(s).trim().replace(/\s/g, '').replace('€', '');
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  const n = Number(s);
  return isFinite(n) ? Math.round(n * 100) / 100 : NaN;
}
let toastTimer;
function toast(m){
  const t = $('#toast'); t.classList.remove('act'); t.textContent = m; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
}
function hrError(m){
  const map = {
    'Invalid login credentials': 'Pogrešan email ili lozinka.',
    'User already registered': 'Za taj email već postoji račun.',
    'Email not confirmed': 'Email još nije potvrđen – provjeri inbox.'
  };
  return map[m] || m;
}

let sb, user = null, profile = null, partner = null;
let cats = [], txs = [], shareTxs = [], recs = [];
let month = new Date(); month.setDate(1); month.setHours(0,0,0,0);
let tab = 'pregled', txFilter = 'sve', authMode = 'login';
let draft = null, rDraft = null, accounts = [], accBals = {}, accErr = false, accErrMsg = '';

// ---------------- POKRETANJE ----------------
async function init(){
  if (SUPABASE_URL.startsWith('OVDJE')) {
    $('#app').innerHTML = `<div class="card auth"><div class="logo">🔧</div><h3>Još nije povezano sa Supabaseom</h3>
      <p class="muted">Otvori index.html i na vrhu skripte zalijepi Project URL i anon key iz svog Supabase projekta.</p></div>`;
    return;
  }
  sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  const { data: { session } } = await sb.auth.getSession();
  if (session) { user = session.user; await startApp(); } else showAuth();
  sb.auth.onAuthStateChange((ev) => { if (ev === 'SIGNED_OUT') { user = null; showAuth(); } });
  document.addEventListener('visibilitychange', async () => {
    if (document.visibilityState === 'visible' && user && profile && $('#overlay').hidden) {
      await loadProfile(); await loadCats(); await loadAccounts();
      await Promise.all([loadFavs(), loadGoals()].map(x => x.catch(() => {})));
      await runRecurring(); await loadMonth(); render();
    }
  });
}

function showAuth(msg){
  $('#topbar').hidden = true; $('#nav').hidden = true; $('#fab').hidden = true;
  const reg = authMode === 'register';
  $('#app').innerHTML = `<div class="auth card">
    <div class="logo">💶</div><h1>Financije</h1>
    <p class="muted">${reg ? 'Napravi račun' : 'Prijavi se'}</p>
    ${reg ? '<label>Ime<input id="aName" autocomplete="given-name" placeholder="npr. Luka"></label>' : ''}
    <label>Email<input id="aEmail" type="email" autocomplete="email"></label>
    <label>Lozinka<input id="aPass" type="password" autocomplete="${reg ? 'new-password' : 'current-password'}"></label>
    <button class="btn primary" id="aGo">${reg ? 'Registracija' : 'Prijava'}</button>
    <button class="btn link" id="aSwitch">${reg ? 'Već imaš račun? Prijavi se' : 'Nemaš račun? Registriraj se'}</button>
    <p id="aMsg" class="msg">${esc(msg || '')}</p></div>`;
  $('#aSwitch').onclick = () => { authMode = reg ? 'login' : 'register'; showAuth(); };
  $('#aGo').onclick = doAuth;
  $('#aPass').onkeydown = e => { if (e.key === 'Enter') doAuth(); };
}

async function doAuth(){
  const email = $('#aEmail').value.trim(), password = $('#aPass').value, msg = $('#aMsg');
  msg.textContent = '';
  if (!email || password.length < 6) { msg.textContent = 'Upiši email i lozinku (najmanje 6 znakova).'; return; }
  $('#aGo').disabled = true;
  try {
    if (authMode === 'login') {
      const { data, error } = await sb.auth.signInWithPassword({ email, password });
      if (error) throw error;
      user = data.user; await startApp();
    } else {
      const name = $('#aName').value.trim();
      const { data, error } = await sb.auth.signUp({ email, password, options: { data: { display_name: name } } });
      if (error) throw error;
      if (data.session) { user = data.user; await startApp(); }
      else { authMode = 'login'; showAuth('Račun je napravljen. Potvrdi email preko linka koji ti je stigao, pa se prijavi.'); }
    }
  } catch (e) {
    msg.textContent = hrError(e.message);
  } finally {
    const b = $('#aGo'); if (b) b.disabled = false;
  }
}

async function startApp(){
  try { history.replaceState({ tab: 'pregled', depth: 0 }, ''); } catch (e) {}
  navDepth = 0;
  $('#topbar').hidden = false; $('#nav').hidden = false; $('#fab').hidden = false;
  $('#app').innerHTML = '<p class="center muted">Učitavam…</p>';
  let err = await loadProfile();
  if (!profile && !err) {
    // profil nedostaje – pokušaj ga napraviti
    const { error } = await sb.rpc('ensure_my_profile');
    err = error ? error.message : await loadProfile();
  }
  if (!profile) {
    $('#app').innerHTML = `<div class="card"><h3>Baza još nije postavljena</h3>
      <p>U Supabaseu (SQL Editor) pokreni najnoviju skriptu <b>financije-setup.sql</b>, pa osvježi ovu stranicu.</p>
      <p class="muted small">Poruka iz baze: ${esc(err || 'profil nije pronađen')}</p>
      <button class="btn primary" onclick="location.reload()">Osvježi</button>
      <button class="btn" onclick="logout()">Odjava</button></div>`;
    return;
  }
  await loadCats();
  await loadAccounts();
  // dodatni podaci – ako nešto ne uspije, aplikacija radi i bez toga
  const safe = f => Promise.resolve().then(f).catch(e => console.warn(e));
  await safe(loadRules);
  await Promise.all([safe(loadFavs), safe(loadCatUse), safe(loadTags), safe(loadGoals), safe(loadRecs)]);
  await runRecurring();
  await loadMonth();
  render();
  const akcija = new URLSearchParams(location.search).get('akcija');
  if (akcija === 'stat') go('stat');
  else if (akcija === 'novi') openNew();
}

// ---------------- UČITAVANJE PODATAKA ----------------
async function loadProfile(){
  const { data, error } = await sb.from('profiles').select('*').eq('id', user.id).maybeSingle();
  if (error) { profile = null; partner = null; return error.message; }
  profile = data; partner = null;
  if (profile && profile.partner_id) {
    const { data: p } = await sb.from('profiles').select('id,display_name').eq('id', profile.partner_id).maybeSingle();
    partner = p;
  }
}
async function loadCats(){
  const { data } = await sb.from('categories').select('*').order('sort').order('name');
  cats = data || [];
}
const catById = id => cats.find(c => c.id === id);
const myCats = kind => cats.filter(c => c.user_id === user.id && c.kind === kind);

// =====================================================================
//  GRAFOVI

const MSHORT = ['Sij','Velj','Ožu','Tra','Svi','Lip','Srp','Kol','Ruj','Lis','Stu','Pro'];
const CHART_MODES = [['trake','Trake'],['krug','Krug'],['trend','Trend'],['tok','Tijek']];
let chartMode = 'trake';
try { chartMode = localStorage.getItem('chartMode') || 'trake'; } catch (e) {}
let hist = null; // transakcije zadnjih 12 mjeseci (za trend i usporedbe)

function setChart(m){ chartMode = m; try { localStorage.setItem('chartMode', m); } catch (e) {} render(); }
const chartW = () => Math.max(260, Math.min(640, window.innerWidth) - 64);
const short = v => v >= 1000 ? (v / 1000).toFixed(v >= 10000 ? 0 : 1).replace('.', ',') + 'k' : String(Math.round(v));
function niceMax(v){
  if (v <= 0) return 10;
  const p = 10 ** Math.floor(Math.log10(v)), n = v / p;
  return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p;
}
// stupac zaobljen samo na vrhu, ravan na osnovici
function barPath(x, y, w, h){
  if (h <= 0) return '';
  const r = Math.min(4, w / 2, h);
  return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`;
}
const ymOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
function lastMonths(n){
  const out = [];
  for (let i = n - 1; i >= 0; i--) out.push(new Date(month.getFullYear(), month.getMonth() - i, 1));
  return out;
}
async function loadHist(){
  const start = new Date(month.getFullYear(), month.getMonth() - 11, 1);
  const end = new Date(month.getFullYear(), month.getMonth() + 1, 0);
  const key = iso(start);
  if (hist && hist.key === key) return;
  const { data } = await sb.from('transactions').select('date,kind,amount,category_id')
    .eq('user_id', user.id).in('kind', ['income', 'expense']).gte('date', key).lte('date', iso(end));
  hist = { key, rows: data || [] };
}
function needHist(){
  const key = iso(new Date(month.getFullYear(), month.getMonth() - 11, 1));
  if (hist && hist.key === key) return false;
  loadHist().then(() => { if (['pregled', 'stat'].includes(tab)) render(); });
  return true;
}

function renderChartCard(rows, max){
  const seg = `<div class="seg seg-sm">${CHART_MODES.map(([k, l]) =>
    `<button class="${chartMode === k ? 'on' : ''}" onclick="setChart('${k}')">${l}</button>`).join('')}</div>`;
  let body;
  if (chartMode === 'krug') body = chartDonut(rows);
  else if (chartMode === 'trend') body = needHist() ? '<p class="muted">Učitavam…</p>' : chartTrend();
  else if (chartMode === 'tok') body = needHist() ? '<p class="muted">Učitavam…</p>' : chartFlow();
  else body = chartBars(rows, max);
  return `<div class="card">${seg}${body}</div>`;
}

function chartBars(rows, max){
  let h = '<h3>Troškovi po kategorijama</h3>';
  if (!rows.length) return h + '<p class="muted">Još nema troškova u ovom mjesecu. Dodaj prvi gumbom +.</p>';
  for (const [id, v] of rows) {
    const c = catById(id);
    h += `<div class="bar-row click" onclick="catTrend('${id}')"><div class="bar-label"><span>${c ? esc(c.icon + ' ' + c.name) : '📦 Bez kategorije'}</span><span>${eur.format(v)}</span></div>
      <div class="bar"><i style="width:${(v / max * 100).toFixed(1)}%"></i></div></div>`;
  }
  return h + '<p class="muted small">Dodirni kategoriju za njen trend kroz mjesece.</p>';
}

function chartDonut(rows){
  let h = '<h3>Udio kategorija u troškovima</h3>';
  if (!rows.length) return h + '<p class="muted">Još nema troškova u ovom mjesecu.</p>';
  let segs = rows.slice(0, 7).map(([id, v], i) => ({ id, v, col: `var(--s${i + 1})` }));
  if (rows.length > 7) segs.push({ id: null, v: rows.slice(7).reduce((s, r) => s + r[1], 0), col: 'var(--sx)', other: rows.length - 7 });
  const tot = segs.reduce((s, x) => s + x.v, 0);
  const S = Math.min(240, chartW()), cx = S / 2, R = S / 2 - 2, r0 = R * 0.62;
  const name = s => s.other ? `Ostalo (${s.other} kat.)` : (catById(s.id) ? catById(s.id).icon + ' ' + catById(s.id).name : '📦 Bez kategorije');
  const pct = v => (v / tot * 100).toFixed(v / tot < 0.1 ? 1 : 0).replace('.', ',') + ' %';
  let svg = '', a = -Math.PI / 2;
  const pt = (rad, ang) => `${(cx + rad * Math.cos(ang)).toFixed(2)},${(cx + rad * Math.sin(ang)).toFixed(2)}`;
  for (const s of segs) {
    const tip = esc(`${name(s)}\n${eur.format(s.v)} · ${pct(s.v)}`);
    const click = s.id ? `onclick="catTrend('${s.id}')"` : '';
    if (segs.length === 1) {
      svg += `<circle cx="${cx}" cy="${cx}" r="${(R + r0) / 2}" fill="none" stroke="${s.col}" stroke-width="${R - r0}" data-tip="${tip}" ${click}/>`;
      break;
    }
    const b = a + s.v / tot * Math.PI * 2, large = b - a > Math.PI ? 1 : 0;
    svg += `<path d="M${pt(R, a)}A${R},${R} 0 ${large} 1 ${pt(R, b)}L${pt(r0, b)}A${r0},${r0} 0 ${large} 0 ${pt(r0, a)}Z"
      fill="${s.col}" stroke="var(--card)" stroke-width="2" stroke-linejoin="round" class="mark" data-tip="${tip}" ${click}/>`;
    a = b;
  }
  svg += `<text x="${cx}" y="${cx - 2}" text-anchor="middle" class="t-big">${esc(eur.format(tot))}</text>
    <text x="${cx}" y="${cx + 18}" text-anchor="middle" class="t-ax">potrošeno</text>`;
  h += `<div class="center"><svg width="${S}" height="${S}" viewBox="0 0 ${S} ${S}" role="img" aria-label="Udio kategorija u troškovima">${svg}</svg></div>`;
  h += '<div class="legend">' + segs.map(s => `<div class="lg-row ${s.id ? 'click' : ''}" ${s.id ? `onclick="catTrend('${s.id}')"` : ''}>
    <i style="background:${s.col}"></i><span class="lg-name">${esc(name(s))}</span><span class="muted small">${pct(s.v)}</span><b>${eur.format(s.v)}</b></div>`).join('') + '</div>';
  return h;
}

function axisY(maxV, W, H, top, left){
  let g = '';
  for (const f of [0, 0.5, 1]) {
    const y = top + H - f * H;
    g += `<line x1="${left}" x2="${W}" y1="${y}" y2="${y}" class="grid"/>
      <text x="${left - 6}" y="${y + 4}" text-anchor="end" class="t-ax">${short(maxV * f)}</text>`;
  }
  return g;
}

function chartTrend(){
  const ms = lastMonths(6);
  const data = ms.map(d => {
    const k = ymOf(d); let inc = 0, exp = 0;
    for (const t of hist.rows) if (t.date.startsWith(k)) { if (t.kind === 'income') inc += +t.amount; else exp += +t.amount; }
    return { d, inc, exp };
  });
  let h = `<h3>Prihodi i troškovi – zadnjih 6 mjeseci</h3>
    <div class="legend inline"><span><i style="background:var(--s1)"></i>Prihodi</span><span><i style="background:var(--s2)"></i>Troškovi</span></div>`;
  if (!data.some(x => x.inc || x.exp)) return h + '<p class="muted">Još nema podataka.</p>';
  const W = chartW(), H = 170, top = 10, left = 38, bottom = 24;
  const maxV = niceMax(Math.max(...data.map(x => Math.max(x.inc, x.exp))));
  const gw = (W - left) / data.length, bw = Math.min(26, (gw - 14) / 2);
  let svg = axisY(maxV, W, H, top, left);
  data.forEach((x, i) => {
    const gx = left + i * gw + gw / 2;
    const hi = x.inc / maxV * H, he = x.exp / maxV * H;
    svg += `<path d="${barPath(gx - bw - 1, top + H - hi, bw, hi)}" fill="var(--s1)"/>
      <path d="${barPath(gx + 1, top + H - he, bw, he)}" fill="var(--s2)"/>
      <text x="${gx}" y="${top + H + 17}" text-anchor="middle" class="t-ax${x.d.getTime() === month.getTime() ? ' t-cur' : ''}">${MSHORT[x.d.getMonth()]}</text>
      <rect x="${left + i * gw}" y="${top}" width="${gw}" height="${H}" class="hit"
        data-tip="${esc(`${MONTHS[x.d.getMonth()]} ${x.d.getFullYear()}\nPrihodi: ${eur.format(x.inc)}\nTroškovi: ${eur.format(x.exp)}\nSaldo: ${eur.format(x.inc - x.exp)}`)}"/>`;
  });
  h += `<svg width="100%" viewBox="0 0 ${W} ${H + top + bottom}" role="img" aria-label="Prihodi i troškovi po mjesecima">${svg}</svg>`;
  const avg = data.reduce((s, x) => s + x.exp, 0) / data.length;
  return h + `<p class="muted small">Prosječni mjesečni troškovi: <b>${eur.format(avg)}</b> · dodirni mjesec za detalje</p>`;
}

function chartFlow(){
  const prev = new Date(month.getFullYear(), month.getMonth() - 1, 1);
  const dimC = new Date(month.getFullYear(), month.getMonth() + 1, 0).getDate();
  const dimP = new Date(prev.getFullYear(), prev.getMonth() + 1, 0).getDate();
  const now = new Date();
  const isCur = month.getFullYear() === now.getFullYear() && month.getMonth() === now.getMonth();
  const lastDay = isCur ? now.getDate() : dimC;
  const cum = (d0, dim, upto) => {
    const k = ymOf(d0), perDay = Array(dim + 1).fill(0);
    for (const t of hist.rows) if (t.kind === 'expense' && t.date.startsWith(k)) perDay[+t.date.slice(8, 10)] += +t.amount;
    const out = []; let s = 0;
    for (let d = 1; d <= upto; d++) { s += perDay[d]; out.push(s); }
    return out;
  };
  const cur = cum(month, dimC, lastDay), pr = cum(prev, dimP, dimP);
  let h = `<h3>Potrošnja kroz mjesec</h3>
    <div class="legend inline"><span><i style="background:var(--s1)"></i>${MONTHS[month.getMonth()]}</span><span><i style="background:var(--sx)"></i>${MONTHS[prev.getMonth()]}</span></div>`;
  if (!cur.some(v => v) && !pr.some(v => v)) return h + '<p class="muted">Još nema troškova.</p>';
  const W = chartW(), H = 170, top = 12, left = 38, bottom = 24, days = 31;
  const maxV = niceMax(Math.max(...cur, ...pr, 1));
  const X = d => left + (d - 1) / (days - 1) * (W - left - 8), Y = v => top + H - v / maxV * H;
  const line = arr => arr.map((v, i) => `${i ? 'L' : 'M'}${X(i + 1).toFixed(1)},${Y(v).toFixed(1)}`).join('');
  let svg = axisY(maxV, W, H, top, left);
  for (const d of [1, 10, 20, 31]) svg += `<text x="${X(d)}" y="${top + H + 17}" text-anchor="middle" class="t-ax">${d}.</text>`;
  svg += `<path d="${line(pr)}" fill="none" stroke="var(--sx)" stroke-width="2" stroke-linejoin="round"/>
    <path d="${line(cur)}" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linejoin="round"/>`;
  if (cur.length) svg += `<circle cx="${X(cur.length)}" cy="${Y(cur[cur.length - 1])}" r="4" fill="var(--s1)" stroke="var(--card)" stroke-width="2"/>`;
  const cw = (W - left - 8) / (days - 1);
  for (let d = 1; d <= days; d++) {
    const a = d <= cur.length ? eur.format(cur[d - 1]) : '–', b = d <= pr.length ? eur.format(pr[d - 1]) : '–';
    svg += `<rect x="${X(d) - cw / 2}" y="${top}" width="${cw}" height="${H}" class="hit"
      data-tip="${esc(`Do ${d}. u mjesecu\n${MONTHS[month.getMonth()]}: ${a}\n${MONTHS[prev.getMonth()]}: ${b}`)}"/>`;
  }
  h += `<svg width="100%" viewBox="0 0 ${W} ${H + top + bottom}" role="img" aria-label="Zbrojna potrošnja po danima">${svg}</svg>`;
  if (cur.length && pr.length) {
    const diff = cur[cur.length - 1] - pr[Math.min(cur.length, pr.length) - 1];
    h += `<p class="small">Do ${cur.length}. dana: ${eur.format(cur[cur.length - 1])} – to je
      <b class="${diff > 0 ? 'neg' : 'pos'}">${eur.format(Math.abs(diff))} ${diff > 0 ? 'više' : 'manje'}</b> nego prošli mjesec do istog dana.</p>`;
  }
  return h;
}

async function catTrend(id){
  const c = catById(id);
  openSheet('<h2>Učitavam…</h2>');
  await loadHist();
  const ms = lastMonths(6);
  const data = ms.map(d => ({ d, v: hist.rows.filter(t => t.kind === 'expense' && (id === 'none' ? !t.category_id : t.category_id === id) && t.date.startsWith(ymOf(d))).reduce((s, t) => s + +t.amount, 0) }));
  const W = Math.min(chartW(), 560), H = 160, top = 18, left = 38, bottom = 24;
  const budget = c && +c.budget > 0 ? +c.budget : 0;
  const avg = data.reduce((s, x) => s + x.v, 0) / data.length;
  const maxV = niceMax(Math.max(...data.map(x => x.v), budget, 1));
  const gw = (W - left) / data.length, bw = Math.min(34, gw - 12);
  let svg = axisY(maxV, W, H, top, left);
  data.forEach((x, i) => {
    const gx = left + i * gw + gw / 2, bh = x.v / maxV * H;
    svg += `<path d="${barPath(gx - bw / 2, top + H - bh, bw, bh)}" fill="var(--s1)"/>
      ${x.v ? `<text x="${gx}" y="${top + H - bh - 5}" text-anchor="middle" class="t-val">${short(x.v)}</text>` : ''}
      <text x="${gx}" y="${top + H + 17}" text-anchor="middle" class="t-ax${x.d.getTime() === month.getTime() ? ' t-cur' : ''}">${MSHORT[x.d.getMonth()]}</text>
      <rect x="${left + i * gw}" y="${top}" width="${gw}" height="${H}" class="hit" data-tip="${esc(`${MONTHS[x.d.getMonth()]} ${x.d.getFullYear()}\n${eur.format(x.v)}`)}"/>`;
  });
  if (budget) svg += `<line x1="${left}" x2="${W}" y1="${top + H - budget / maxV * H}" y2="${top + H - budget / maxV * H}" class="ref"/>`;
  openSheet(`<h2>${c ? esc(c.icon + ' ' + c.name) : 'Bez kategorije'}</h2>
    <p class="muted small">Troškovi zadnjih 6 mjeseci${budget ? ' · isprekidana crta = budžet ' + eur.format(budget) : ''}</p>
    <svg width="100%" viewBox="0 0 ${W} ${H + top + bottom}" role="img" aria-label="Troškovi kategorije po mjesecima">${svg}</svg>
    <p>Prosjek: <b>${eur.format(avg)}</b> mjesečno</p>
    <button class="btn" onclick="closeSheet()">Zatvori</button>`);
}

let favs = [], catUse = {};
async function loadFavs(){
  const { data, error } = await sb.from('favorites').select('*').order('sort').order('created_at');
  favs = error ? [] : (data || []);
}
async function loadCatUse(){
  const from = new Date(); from.setDate(from.getDate() - 120);
  const { data } = await sb.from('transactions').select('category_id').eq('user_id', user.id).gte('date', iso(from)).in('kind', ['expense', 'income']);
  catUse = {};
  for (const t of data || []) if (t.category_id) catUse[t.category_id] = (catUse[t.category_id] || 0) + 1;
}
// kategorije poredane po tome koliko ih koristiš
const catsByUse = kind => myCats(kind).map((c, i) => [c, i]).sort((a, b) => ((catUse[b[0].id] || 0) - (catUse[a[0].id] || 0)) || (a[1] - b[1])).map(x => x[0]);

function favChips(){
  if (!favs.length) return '';
  return `<div class="chips fav-row">${favs.map(f => `<button class="chip" onclick="quickAdd('${f.id}')">${esc(f.icon)} ${esc(f.label)} <b>${eur.format(f.amount)}</b></button>`).join('')}</div>`;
}
async function quickAdd(id){
  const f = favs.find(x => x.id === id); if (!f) return;
  const row = { kind: f.kind, amount: f.amount, category_id: f.category_id, date: iso(new Date()), note: f.note || f.label, is_shared: false };
  if (accounts.length) row.account_id = activeAccs().some(a => a.id === f.account_id) ? f.account_id : defaultAcc();
  const { data, error } = await sb.from('transactions').insert(row).select().single();
  if (error) return toast(error.message);
  if (f.category_id) catUse[f.category_id] = (catUse[f.category_id] || 0) + 1;
  closeSheet();
  const now = new Date(); month = new Date(now.getFullYear(), now.getMonth(), 1);
  await loadMonth(); render();
  toastAction(`Dodano: ${f.icon} ${f.label} ${eur.format(f.amount)}`, 'Poništi', async () => {
    await sb.from('transactions').delete().eq('id', data.id);
    await loadMonth(); render(); toast('Poništeno');
  });
}
async function saveAsFav(){
  syncDraft();
  const a = parseAmount(draft.amount);
  if (!(a > 0)) return toast('Prvo upiši iznos');
  if (!draft.category_id) return toast('Prvo odaberi kategoriju');
  const c = catById(draft.category_id);
  const label = (draft.note || '').trim() || (c ? c.name : 'Unos');
  const { error } = await sb.from('favorites').insert({ label: label.slice(0, 30), icon: c ? c.icon : '⭐', kind: draft.kind, amount: a,
    category_id: draft.category_id, account_id: draft.account_id || null, note: (draft.note || '').trim() || null });
  if (error) return toast(/relation|exist|schema/i.test(error.message) ? 'Prvo pokreni supabase-v10.sql u Supabaseu' : error.message);
  await loadFavs(); render(); toast('⭐ Dodano u brze unose – sad je na Pregledu i u prozoru za unos');
}
function renderFavs(){
  let h = back() + `<div class="card list"><h3>⭐ Brzi unosi</h3>
    <p class="muted small">Stvari koje često plaćaš (kava, karta, ručak…) dodaješ jednim dodirom s Pregleda ili iz prozora za unos.
    Novi brzi unos napraviš tako da u prozoru za unos ispuniš iznos i kategoriju, pa dodirneš <b>☆ Spremi kao brzi unos</b>.</p>`;
  if (!favs.length) h += '<p class="muted">Još nema brzih unosa.</p>';
  for (const f of favs) {
    const c = catById(f.category_id), a = accById(f.account_id);
    h += `<div class="tx" onclick="editFav('${f.id}')"><span class="ic">${esc(f.icon)}</span>
      <div class="tx-main"><div>${esc(f.label)}</div><div class="muted small">${esc([c ? c.name : '', a ? a.name : ''].filter(Boolean).join(' · '))}</div></div>
      <b>${eur.format(f.amount)}</b></div>`;
  }
  return h + '</div>';
}
function editFav(id){
  const f = favs.find(x => x.id === id);
  openSheet(`<h2>Brzi unos</h2>
    <label>Naziv<input id="fvL" value="${esc(f.label)}" maxlength="30"></label>
    <label>Ikona<input id="fvI" value="${esc(f.icon)}" maxlength="8" style="font-size:24px;text-align:center"></label>
    <label>Iznos (€)<input id="fvA" inputmode="decimal" value="${String(f.amount).replace('.', ',')}"></label>
    ${activeAccs().length > 1 ? `<label>Račun<select id="fvAcc">${activeAccs().map(a => `<option value="${a.id}" ${a.id === f.account_id ? 'selected' : ''}>${esc(a.icon + ' ' + a.name)}</option>`).join('')}</select></label>` : ''}
    <button class="btn primary" onclick="saveFav('${id}')">Spremi</button>
    <button class="btn danger" onclick="delFav('${id}')">Obriši</button>`);
}
async function saveFav(id){
  const a = parseAmount($('#fvA').value);
  if (!(a > 0)) return toast('Upiši iznos');
  const row = { label: $('#fvL').value.trim() || 'Unos', icon: $('#fvI').value.trim() || '⭐', amount: a };
  const acc = $('#fvAcc'); if (acc) row.account_id = acc.value;
  const { error } = await sb.from('favorites').update(row).eq('id', id);
  if (error) return toast(error.message);
  closeSheet(); await loadFavs(); render();
}
async function delFav(id){
  if (!confirm('Obrisati ovaj brzi unos?')) return;
  await sb.from('favorites').delete().eq('id', id);
  closeSheet(); await loadFavs(); render();
}
let toastActTimer;
function toastAction(msg, label, fn){
  const t = $('#toast');
  t.innerHTML = `<span>${esc(msg)}</span> <button class="toast-btn">${esc(label)}</button>`;
  t.classList.add('show', 'act');
  t.querySelector('button').onclick = () => { t.classList.remove('show', 'act'); clearTimeout(toastActTimer); fn(); };
  clearTimeout(toastTimer); clearTimeout(toastActTimer);
  toastActTimer = setTimeout(() => t.classList.remove('show', 'act'), 6000);
}

let flt = { q: '', scope: 'mjesec', cat: '', acc: '', tag: '', kind: '' };
let fltData = null;       // { key, rows } za opseg godina/sve
let allTags = [];         // [naziv, broj]
async function loadTags(){
  const { data, error } = await sb.from('transactions').select('tags').eq('user_id', user.id).not('tags', 'is', null);
  if (error) { allTags = []; return; }
  const c = {};
  for (const t of data || []) for (const g of t.tags || []) c[g] = (c[g] || 0) + 1;
  allTags = Object.entries(c).sort((a, b) => b[1] - a[1]);
}
const fltActive = () => !!(flt.q || flt.cat || flt.acc || flt.tag || flt.kind);
function fltKey(){ return flt.scope === 'godina' ? 'g' + month.getFullYear() : flt.scope === 'sve' ? 'sve' : null; }
async function ensureFltData(){
  const key = fltKey();
  if (!key || (fltData && fltData.key === key)) return;
  let q = sb.from('transactions').select('*').order('date', { ascending: false }).order('created_at', { ascending: false }).limit(5000);
  if (flt.scope === 'godina') q = q.gte('date', `${month.getFullYear()}-01-01`).lte('date', `${month.getFullYear()}-12-31`);
  const { data } = await q;
  fltData = { key, rows: (data || []).filter(t => t.user_id === user.id || t.is_shared || isJoint(accById(t.account_id)) || isJoint(accById(t.to_account_id)))
    .sort((a, b) => b.date.localeCompare(a.date) || String(b.created_at || '').localeCompare(String(a.created_at || ''))) };

function shrinkImage(f){
  return new Promise((ok, no) => {
    const u = URL.createObjectURL(f), im = new Image();
    im.onload = () => {
      const s = Math.min(1, 1568 / Math.max(im.width, im.height));
      const c = document.createElement('canvas');
      c.width = Math.round(im.width * s); c.height = Math.round(im.height * s);
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      URL.revokeObjectURL(u);
      ok(c.toDataURL('image/jpeg', 0.85).split(',')[1]);
    };
    im.onerror = () => { URL.revokeObjectURL(u); no(new Error('Ne mogu otvoriti sliku')); };
    im.src = u;
  });
}

function parseDateCell(v){

function parseNum(v){

  if (s.endsWith('-')) { neg = true; s = s.slice(0, -1); }
  if (s.startsWith('-') || s.startsWith('−')) { neg = !neg; s = s.slice(1); }
  if (s.startsWith('+')) s = s.slice(1);
  const lc = s.lastIndexOf(','), ld = s.lastIndexOf('.');
  if (lc >= 0 && ld >= 0) s = lc > ld ? s.replace(/\./g, '').replace(',', '.') : s.replace(/,/g, '');
  else if (lc >= 0) s = s.replace(/\./g, '').replace(',', '.');
  else if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');

  return isFinite(n) ? (neg ? -n : n) : 0;
}

  if (m.date < 0) m.date = find(/datum|date/);

  return h;
}
function editGoal(id){
  const g = id ? goals.find(x => x.id === id) : { name: '', icon: '🎯', target: '', saved: 0, deadline: '', account_id: null };
  const linked = !!(g.account_id && accById(g.account_id));

    ${id && !linked && !g.done ? `<div class="summary" style="gap:8px">
      <button class="btn primary" style="margin:0" onclick="goalAdd('${id}',1)">＋ Uplati</button>

      <input id="gStep" class="amount" inputmode="decimal" placeholder="iznos uplate €" style="margin-top:8px">` : ''}

    <label>Ciljani iznos (€)<input id="gT" inputmode="decimal" value="${g.target ? String(g.target).replace('.', ',') : ''}"></label>
    <label>Rok (nije obavezno)<input id="gD" type="date" value="${g.deadline || ''}"></label>
    <label>Napredak prati<select id="gA" onchange="$('#gSavedWrap').hidden=!!this.value">
      <option value="">ručno (upisujem uplate)</option>
      ${activeAccs().map(a => `<option value="${a.id}" ${a.id === g.account_id ? 'selected' : ''}>stanje računa: ${esc(a.icon + ' ' + a.name)}</option>`).join('')}</select></label>
    <div id="gSavedWrap" ${linked ? 'hidden' : ''}><label>Dosad ušteđeno (€)<input id="gS" inputmode="decimal" value="${String(+g.saved || 0).replace('.', ',')}"></label></div>
    <button class="btn primary" onclick="saveGoal(${id ? `'${id}'` : 'null'})">Spremi</button>
    ${id ? `<button class="btn" onclick="goalDone('${id}',${!g.done})">${g.done ? 'Vrati među aktivne' : '✅ Označi kao ostvaren'}</button>
      <button class="btn danger" onclick="delGoal('${id}')">Obriši cilj</button>` : ''}`);

async function saveGoal(id){
  const t = parseAmount($('#gT').value);
  if (!$('#gN').value.trim()) return toast('Upiši naziv');
  if (!(t > 0)) return toast('Upiši ciljani iznos');
  const row = { name: $('#gN').value.trim(), icon: $('#gI').value.trim() || '🎯', target: t, deadline: $('#gD').value || null, account_id: $('#gA').value || null };
  if (!row.account_id) { const s = parseAmount($('#gS').value || '0'); row.saved = s >= 0 ? s : 0; }
  const { error } = id ? await sb.from('goals').update(row).eq('id', id) : await sb.from('goals').insert(row);
  if (error) return toast(/relation|exist|schema/i.test(error.message) ? 'Prvo pokreni supabase-v10.sql u Supabaseu' : error.message);
  closeSheet(); await loadGoals(); render(); toast('Spremljeno');
}
async function goalAdd(id, sign){
  const v = parseAmount($('#gStep').value);
  if (!(v > 0)) { $('#gStep').focus(); return toast('Upiši iznos uplate'); }
  const g = goals.find(x => x.id === id);
  const saved = Math.max(0, Math.round(((+g.saved || 0) + sign * v) * 100) / 100);
  const { error } = await sb.from('goals').update({ saved }).eq('id', id);
  if (error) return toast(error.message);
  closeSheet(); await loadGoals(); render();
  toast(sign > 0 ? `${g.icon} +${eur.format(v)} – sad ${eur.format(saved)}` : `Povučeno ${eur.format(v)}`);
}
async function goalDone(id, done){ await sb.from('goals').update({ done }).eq('id', id); closeSheet(); await loadGoals(); render(); }
async function delGoal(id){
  if (!confirm('Obrisati cilj?')) return;
  await sb.from('goals').delete().eq('id', id); closeSheet(); await loadGoals(); render();
}

function fixedTotals(){
  let exp = 0, inc = 0;
  for (const r of recs) if (r.active) { if (r.kind === 'expense') exp += +r.amount; else inc += +r.amount; }
  return { exp, inc };
}
function renderFixedCard(){
  const f = fixedTotals();
  if (!f.exp && !f.inc) return '';
  const subs = recs.filter(r => r.active && r.kind === 'expense' && catById(r.category_id) && norm(catById(r.category_id).name) === 'pretplate');
  const subSum = subs.reduce((s, r) => s + +r.amount, 0);
  return `<div class="card"><h3>📌 Fiksni mjesečni iznosi</h3>
    <div class="summary" style="gap:8px">
      <div class="stat"><span class="muted small">Fiksni troškovi</span><b class="neg">${eur.format(f.exp)}</b><span class="tile-sub">${eur.format(f.exp * 12)} godišnje</span></div>
      <div class="stat"><span class="muted small">Fiksni prihodi</span><b class="pos">${eur.format(f.inc)}</b><span class="tile-sub">${eur.format(f.inc * 12)} godišnje</span></div></div>
    ${f.inc ? `<p class="small">Nakon fiksnih troškova ostaje <b>${eur.format(f.inc - f.exp)}</b> mjesečno za sve ostalo.</p>` : ''}
    ${subs.length ? `<p class="small">Od toga pretplate: <b>${eur.format(subSum)}/mj</b> (${eur.format(subSum * 12)} godišnje) – ${subs.map(r => esc(r.note || '')).filter(Boolean).join(', ')}</p>` : ''}</div>`;
}

let yearData = null;
async function loadYear(){
  const Y = month.getFullYear();
  if (yearData && yearData.Y === Y) return;
  const { data } = await sb.from('transactions').select('date,kind,amount,category_id').eq('user_id', user.id)
    .in('kind', ['income', 'expense']).gte('date', `${Y - 1}-01-01`).lte('date', `${Y}-12-31`);
  yearData = { Y, rows: data || [] };
}
async function changeYear(d){ month = new Date(month.getFullYear() + d, month.getMonth(), 1); await loadMonth(); render(); }
function renderYear(){
  const Y = month.getFullYear();
  if (!yearData || yearData.Y !== Y) { loadYear().then(() => { if (tab === 'stat') render(); }); return '<p class="center muted">Učitavam…</p>'; }
  const now = new Date();
  const agg = y => {
    const r = { inc: 0, exp: 0, m: Array.from({ length: 12 }, () => ({ inc: 0, exp: 0 })), cat: {} };
    for (const t of yearData.rows) if (t.date.startsWith(y + '-')) {
      const mi = +t.date.slice(5, 7) - 1, a = +t.amount;
      if (t.kind === 'income') { r.inc += a; r.m[mi].inc += a; }
      else { r.exp += a; r.m[mi].exp += a; const k = t.category_id || 'none'; r.cat[k] = (r.cat[k] || 0) + a; }
    }
    return r;
  };
  const A = agg(Y), B = agg(Y - 1);
  const isCur = Y === now.getFullYear();
  const upto = isCur ? now.getMonth() + 1 : 12;            // usporedba "do istog mjeseca"
  const sumTo = (r, k) => r.m.slice(0, upto).reduce((s, x) => s + x[k], 0);
  const bExpTo = sumTo(B, 'exp'), bIncTo = sumTo(B, 'inc');
  const pct = (a, b) => b > 0 ? Math.round((a / b - 1) * 100) : null;
  const pctHtml = (p, upIsGood) => p === null ? '' : ` · <span class="${(p > 0) === upIsGood ? 'pos' : 'neg'}">${p > 0 ? '+' : ''}${p} %</span>`;
  const save = A.inc - A.exp;
  let h = `<div class="card year-nav"><button class="btn link" onclick="changeYear(-1)">‹ ${Y - 1}</button><b>Godina ${Y}</b>
    <button class="btn link" onclick="changeYear(1)" ${isCur ? 'disabled' : ''}>${Y + 1} ›</button></div>`;
  if (!A.inc && !A.exp) return h + '<div class="card"><p class="muted">Nema unosa za ovu godinu.</p></div>';
  const cmpLbl = `${isCur ? 'isto razdoblje ' : ''}${Y - 1}`;
  h += `<div class="summary">
    <div class="card stat"><span class="muted small">Troškovi ${Y}${isCur ? ' (dosad)' : ''}</span><b class="neg">${eur.format(A.exp)}</b><span class="tile-sub">${bExpTo ? cmpLbl + ': ' + eur.format(bExpTo) + pctHtml(pct(A.exp, bExpTo), false) : 'prosjek ' + eur.format(A.exp / upto) + '/mj'}</span></div>
    <div class="card stat"><span class="muted small">Prihodi ${Y}${isCur ? ' (dosad)' : ''}</span><b class="pos">${eur.format(A.inc)}</b><span class="tile-sub">${bIncTo ? cmpLbl + ': ' + eur.format(bIncTo) + pctHtml(pct(A.inc, bIncTo), true) : 'prosjek ' + eur.format(A.inc / upto) + '/mj'}</span></div>
    <div class="card stat"><span class="muted small">Ušteđeno</span><b class="${save >= 0 ? 'pos' : 'neg'}">${eur.format(save)}</b><span class="tile-sub">${A.inc ? Math.round(save / A.inc * 100) + ' % prihoda' : ''}</span></div>
    <div class="card stat"><span class="muted small">Prosječno mjesečno</span><b>${eur.format(A.exp / upto)}</b><span class="tile-sub">troškova (${upto} mj.)</span></div></div>`;
  // graf: mjesečni troškovi ove i prošle godine
  const W = chartW(), H = 160, top = 10, left = 38, bottom = 24;
  const maxV = niceMax(Math.max(...A.m.map(x => x.exp), ...B.m.map(x => x.exp), 1));
  const gw = (W - left) / 12, bw = Math.max(3, Math.min(12, (gw - 6) / 2));
  let svg = axisY(maxV, W, H, top, left);
  for (let i = 0; i < 12; i++) {
    const gx = left + i * gw + gw / 2, hb = B.m[i].exp / maxV * H, ha = A.m[i].exp / maxV * H;
    svg += `<path d="${barPath(gx - bw - 1, top + H - hb, bw, hb)}" fill="var(--sx)"/>
      <path d="${barPath(gx + 1, top + H - ha, bw, ha)}" fill="var(--s2)"/>
      <text x="${gx}" y="${top + H + 17}" text-anchor="middle" class="t-ax">${MSHORT[i].slice(0, gw < 30 ? 1 : 3)}</text>
      <rect x="${left + i * gw}" y="${top}" width="${gw}" height="${H}" class="hit" data-tip="${esc(`${MONTHS[i]}\n${Y}: ${eur.format(A.m[i].exp)}\n${Y - 1}: ${eur.format(B.m[i].exp)}`)}"/>`;
  }
  h += `<div class="card"><h3>Troškovi po mjesecima</h3>
    <div class="legend inline"><span><i style="background:var(--s2)"></i>${Y}</span><span><i style="background:var(--sx)"></i>${Y - 1}</span></div>
    <svg width="100%" viewBox="0 0 ${W} ${H + top + bottom}" role="img" aria-label="Troškovi po mjesecima, usporedba godina">${svg}</svg></div>`;
  // kategorije
  const ids = [...new Set([...Object.keys(A.cat), ...Object.keys(B.cat)])].map(id => ({ id, a: A.cat[id] || 0, b: B.cat[id] || 0 })).sort((x, y) => y.a - x.a || y.b - x.b);
  h += `<div class="card"><h3>Po kategorijama</h3><div class="st-row st-head"><span>Kategorija</span><span>${Y - 1}</span><span>${Y}</span></div>`;
  for (const r of ids) {
    const c = catById(r.id), p = pct(r.a, r.b);
    h += `<div class="st-row click" onclick="catTrend('${r.id}')"><span class="nm">${c ? esc(c.icon + ' ' + c.name) : '📦 Bez kategorije'}</span>
      <span class="muted">${r.b ? eur.format(r.b) : '–'}</span><span>${eur.format(r.a)}${p !== null && Math.abs(p) >= 10 && !isCur ? ` <span class="${p > 0 ? 'neg' : 'pos'}">${p > 0 ? '▲' : '▼'}</span>` : ''}</span></div>`;
  }
  return h + `${isCur ? '<p class="muted small">Tekuća godina još traje, pa su iznosi po kategorijama zasad manji od prošlogodišnjih.</p>' : ''}</div>`;
}

let statN = 6;
try { const v = localStorage.getItem('statN'); statN = v === 'god' ? 'god' : (+v || 6); } catch (e) {}
function setStatN(n){ statN = n; try { localStorage.setItem('statN', n); } catch (e) {} render(); }
const statSeg = () => `<div class="seg">${[[3, '3 mj.'], [6, '6 mj.'], [12, '12 mj.'], ['god', 'Godina']].map(([k, l]) => `<button class="${statN === k ? 'on' : ''}" onclick="setStatN(${typeof k === 'string' ? `'${k}'` : k})">${l}</button>`).join('')}</div>`;

function renderStat(){
  if (statN === 'god') return statSeg() + renderYear();
  if (needHist()) return statSeg() + '<p class="center muted">Učitavam…</p>';
  const now = new Date(), curKey = ymOf(now);
  const all = lastMonths(statN).map(d => {
    const k = ymOf(d); let inc = 0, exp = 0;
    for (const t of hist.rows) if (t.date.startsWith(k)) { if (t.kind === 'income') inc += +t.amount; else exp += +t.amount; }
    return { d, k, inc, exp, partial: k === curKey };
  }).filter(x => x.k <= curKey);
  // prosjeci se računaju samo iz završenih mjeseci, od prvog mjeseca s unosima
  const first = all.findIndex(x => x.inc || x.exp);
  const full = first < 0 ? [] : all.slice(first).filter(x => !x.partial);
  const n = full.length;
  const avg = f => n ? full.reduce((s, x) => s + f(x), 0) / n : 0;
  const avgExp = avg(x => x.exp), avgInc = avg(x => x.inc), avgSave = avgInc - avgExp;
  const seg = statSeg();
  let h = seg;
  if (first < 0) return h + '<div class="card"><p class="muted">Još nema unosa u ovom razdoblju.</p></div>';

  // --- pločice
  const cur = all.find(x => x.partial);
  let tiles = '';
  if (n) {
    tiles += `<div class="card stat"><span class="muted small">Prosječni troškovi</span><b class="neg">${eur.format(avgExp)}</b><span class="tile-sub">mjesečno</span></div>
      <div class="card stat"><span class="muted small">Prosječni prihodi</span><b class="pos">${eur.format(avgInc)}</b><span class="tile-sub">mjesečno</span></div>
      <div class="card stat"><span class="muted small">Prosječna ušteda</span><b class="${avgSave >= 0 ? 'pos' : 'neg'}">${eur.format(avgSave)}</b><span class="tile-sub">${avgInc > 0 ? Math.round(avgSave / avgInc * 100) + ' % prihoda' : 'mjesečno'}</span></div>`;
  }
  if (cur) {
    const day = now.getDate(), dim = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
    const proj = cur.exp / day * dim;
    const vs = n && avgExp > 0 ? Math.round((proj / avgExp - 1) * 100) : null;
    tiles += `<div class="card stat"><span class="muted small">${MONTHS[now.getMonth()]} (u tijeku)</span><b>${eur.format(cur.exp)}</b>
      <span class="tile-sub">${day < 7 ? 'potrošeno dosad · procjena od 7. dana' : `ovim tempom ~${eur.format(proj)}${vs !== null ? ` · <span class="${vs > 0 ? 'neg' : 'pos'}">${vs > 0 ? '+' : ''}${vs} %</span> od prosjeka` : ''}`}</span></div>`;
  }
  if (n >= 2) {
    const hi = full.reduce((a, b) => b.exp > a.exp ? b : a), lo = full.reduce((a, b) => b.exp < a.exp ? b : a);
    tiles += `<div class="card stat"><span class="muted small">Najviše potrošeno</span><b>${eur.format(hi.exp)}</b><span class="tile-sub">${MONTHS[hi.d.getMonth()]} ${hi.d.getFullYear()}</span></div>
      <div class="card stat"><span class="muted small">Najmanje potrošeno</span><b>${eur.format(lo.exp)}</b><span class="tile-sub">${MONTHS[lo.d.getMonth()]} ${lo.d.getFullYear()}</span></div>`;
  }
  h += `<div class="summary">${tiles}</div>`;
  if (!n) h += '<div class="card"><p class="muted small">Prosjeci će se pojaviti kad završi prvi cijeli mjesec s unosima. Do tada vidiš procjenu za tekući mjesec.</p></div>';

  // --- graf troškova po mjesecima s linijom prosjeka
  const shown = all.slice(first);
  const W = chartW(), H = 170, top = 18, left = 38, bottom = 24;
  const maxV = niceMax(Math.max(...shown.map(x => x.exp), avgExp, 1));
  const gw = (W - left) / shown.length, bw = Math.min(34, Math.max(8, gw - 10));
  let svg = axisY(maxV, W, H, top, left);
  shown.forEach((x, i) => {
    const gx = left + i * gw + gw / 2, bh = x.exp / maxV * H;
    svg += `<path d="${barPath(gx - bw / 2, top + H - bh, bw, bh)}" fill="var(--s2)" class="${x.partial ? 'partial' : ''}"/>
      ${shown.length <= 6 && x.exp ? `<text x="${gx}" y="${top + H - bh - 5}" text-anchor="middle" class="t-val">${short(x.exp)}</text>` : ''}
      <text x="${gx}" y="${top + H + 17}" text-anchor="middle" class="t-ax${x.d.getTime() === month.getTime() ? ' t-cur' : ''}">${MSHORT[x.d.getMonth()]}</text>
      <rect x="${left + i * gw}" y="${top}" width="${gw}" height="${H}" class="hit"
        data-tip="${esc(`${MONTHS[x.d.getMonth()]} ${x.d.getFullYear()}${x.partial ? ' (u tijeku)' : ''}\nTroškovi: ${eur.format(x.exp)}\nPrihodi: ${eur.format(x.inc)}\nSaldo: ${eur.format(x.inc - x.exp)}`)}"/>`;
  });
  if (n) {
    const y = top + H - avgExp / maxV * H;
    svg += `<line x1="${left}" x2="${W}" y1="${y}" y2="${y}" class="ref"/>`;
  }
  h += `<div class="card"><h3>Troškovi po mjesecima</h3>
    <svg width="100%" viewBox="0 0 ${W} ${H + top + bottom}" role="img" aria-label="Troškovi po mjesecima">${svg}</svg>
    <p class="muted small">${n ? `Isprekidana crta = prosjek završenih mjeseci (${eur.format(avgExp)})` : ''}${n && cur ? ', ' : ''}${cur ? 'blijedi stupac = tekući mjesec' : ''}. Prijenosi između računa se ne računaju.</p></div>`;

  h += renderFixedCard();
  // --- prosjek po kategorijama
  const viewK = ymOf(month), byCat = {}, curCat = {};
  const fullKeys = new Set(full.map(x => x.k));
  for (const t of hist.rows) if (t.kind === 'expense') {
    const k = t.category_id || 'none', mk = t.date.slice(0, 7);
    if (fullKeys.has(mk)) byCat[k] = (byCat[k] || 0) + +t.amount;
    if (mk === viewK) curCat[k] = (curCat[k] || 0) + +t.amount;
  }
  const ids = [...new Set([...Object.keys(byCat), ...Object.keys(curCat)])]
    .map(id => ({ id, avg: n ? (byCat[id] || 0) / n : 0, cur: curCat[id] || 0 }))
    .sort((a, b) => (b.avg - a.avg) || (b.cur - a.cur));
  if (ids.length) {
    h += `<div class="card"><h3>Po kategorijama</h3>
      <div class="st-row st-head"><span>Kategorija</span><span>Prosjek</span><span>${MSHORT[month.getMonth()]}${viewK === curKey ? ' (dosad)' : ''}</span></div>`;
    for (const r of ids) {
      const c = catById(r.id), up = n && r.cur > r.avg * 1.1, down = n && r.cur < r.avg * 0.9;
      h += `<div class="st-row click" onclick="catTrend('${r.id}')"><span class="nm">${c ? esc(c.icon + ' ' + c.name) : '📦 Bez kategorije'}</span>
        <span>${n ? eur.format(r.avg) : '–'}</span>
        <span>${eur.format(r.cur)}${up ? ' <span class="neg">▲</span>' : down ? ' <span class="pos">▼</span>' : ''}</span></div>`;
    }
    h += `<p class="muted small">▲ više od prosjeka, ▼ manje od prosjeka (za više od 10 %). Dodirni kategoriju za njen graf.</p></div>`;
  }
  return h;
}

// oblačić s detaljima (miš ili dodir)
function initTip(){
  const tip = document.createElement('div'); tip.id = 'tip'; document.body.appendChild(tip);
  const show = e => {
    const t = e.target.closest && e.target.closest('[data-tip]');
    if (!t) { tip.style.display = 'none'; return; }
    tip.textContent = t.getAttribute('data-tip'); tip.style.display = 'block';
    const w = tip.offsetWidth, h = tip.offsetHeight;
    let x = Math.max(8, Math.min(window.innerWidth - w - 8, e.clientX - w / 2));
    let y = e.clientY - h - 14; if (y < 8) y = e.clientY + 18;
    tip.style.left = x + 'px'; tip.style.top = y + 'px';
  };
  document.addEventListener('pointermove', show);
  document.addEventListener('pointerdown', show);
  window.addEventListener('scroll', () => { tip.style.display = 'none'; }, true);
}

// Stanje svakog računa = početno stanje + prihodi − troškovi ± prijenosi od datuma početnog stanja
async function loadAccBal(){
  accBals = {};
  if (!accounts.length) return;
  const minDate = accounts.reduce((m, a) => a.opening_date < m ? a.opening_date : m, accounts[0].opening_date);
  const { data, error } = await sb.from('transactions').select('user_id,kind,amount,account_id,to_account_id,date').gte('date', minDate);
  if (error) return;
  const b = {}; for (const a of accounts) b[a.id] = +a.opening_balance || 0;
  const add = (accId, v, date) => { const a = accId ? accById(accId) : accById(primaryAcc()); if (a && date >= a.opening_date) b[a.id] += v; };
  for (const t of data || []) {
    const v = +t.amount;
    if (t.user_id !== user.id) {
      // partnerovi unosi: podmirenje ide na moj glavni račun, a unosi na zajedničkom računu mijenjaju njegovo stanje
      const j = id => id && isJoint(accById(id)) ? id : null;
      if (t.kind === 'settlement') add(primaryAcc(), v, t.date);
      else if (t.kind === 'income' && j(t.account_id)) add(t.account_id, v, t.date);
      else if (t.kind === 'expense' && j(t.account_id)) add(t.account_id, -v, t.date);
      else if (t.kind === 'transfer') { if (j(t.account_id)) add(t.account_id, -v, t.date); if (j(t.to_account_id)) add(t.to_account_id, v, t.date); }
      continue;
    }
    if (t.kind === 'income') add(t.account_id, v, t.date);
    else if (t.kind === 'expense' || t.kind === 'settlement') add(t.account_id, -v, t.date);
    else if (t.kind === 'transfer') { add(t.account_id, -v, t.date); if (t.to_account_id) add(t.to_account_id, v, t.date); }
  }
  for (const k in b) b[k] = Math.round(b[k] * 100) / 100;
  accBals = b;
}

  if (!name) return toast('Upiši naziv');
  const raw = $('#aBal').value.trim(), neg = /^[-−]/.test(raw), v = parseAmount(raw.replace(/^[-−]/, ''));
  if (!(v >= 0)) return toast('Upiši stanje');
  const row = { name, icon };
  const sh = $('#aSh'); if (sh) row.shared = sh.checked;

function initialLastMonth(day){
  const now = new Date();
  // ako je dan već prošao ovaj mjesec, kreće od idućeg; inače i ovaj mjesec
  return day < now.getDate() ? ymKey(now) : ymKey(new Date(now.getFullYear(), now.getMonth() - 1, 1));
}

async function runRecurring(){
  const { data: rs, error } = await sb.from('recurring').select('*').eq('active', true);
  if (error || !rs) return;
  const today = new Date(); today.setHours(0,0,0,0);
  const curKey = ymKey(today);
  for (const r of rs) {
    let [y, m] = (r.last_month || initialLastMonth(r.day_of_month)).split('-').map(Number);
    let last = r.last_month;
    const rows = [];
    for (let i = 0; i < 24; i++) {
      m++; if (m > 12) { m = 1; y++; }
      const key = `${y}-${pad(m)}`;
      if (key > curKey) break;
      const dim = new Date(y, m, 0).getDate();
      const dt = new Date(y, m - 1, Math.min(r.day_of_month, dim));
      if (dt > today) break;
      rows.push({ user_id: r.user_id, kind: r.kind, amount: r.amount, category_id: r.category_id, ...(r.account_id ? { account_id: r.account_id } : {}),
        date: iso(dt), note: r.note, is_shared: r.is_shared, recurring_id: r.id });
      last = key;
    }
    if (rows.length) {
      const { error: e1 } = await sb.from('transactions').upsert(rows, { onConflict: 'recurring_id,date', ignoreDuplicates: true });
      if (!e1) await sb.from('recurring').update({ last_month: last }).eq('id', r.id);
    }
  }
}

const mine = () => txs.filter(t => t.user_id === user.id);
function totals(){
  let inc = 0, exp = 0;
  for (const t of mine()) { if (t.kind === 'income') inc += +t.amount; else if (t.kind === 'expense') exp += +t.amount; }
  return { inc, exp };
}
function spentByCat(){
  const m = {};
  for (const t of mine()) if (t.kind === 'expense') { const k = t.category_id || 'none'; m[k] = (m[k] || 0) + +t.amount; }
  return m;
}
// > 0: partner duguje meni; < 0: ja dugujem partneru
function balance(){
  let b = 0;
  for (const t of shareTxs) {
    const a = +t.amount, me = t.user_id === user.id;
    if (t.kind === 'expense') b += me ? a / 2 : -a / 2;
    else if (t.kind === 'settlement') b += me ? a : -a;
  }
  return Math.round(b * 100) / 100;
}

let navDepth = 0, ignorePop = false, pendingSheetPush = false, pendingNav = null;
function go(t, fromHistory){
  if (!fromHistory && t !== tab) {
    navDepth++;
    if (ignorePop) pendingNav = { tab: t, depth: navDepth };
    else history.pushState({ tab: t, depth: navDepth }, '');
  }
  tab = t;
  if (t === 'rec') loadRecs().then(render);
  render(); window.scrollTo(0, 0);
}
function goBack(){ if (navDepth > 0) history.back(); else go('vise'); }
window.addEventListener('popstate', e => {
  if (ignorePop) {                      // povratak koji je pokrenulo zatvaranje prozora
    ignorePop = false;
    if (pendingNav) { history.pushState(pendingNav, ''); pendingNav = null; }
    if (pendingSheetPush && !$('#overlay').hidden) { pendingSheetPush = false; history.pushState({ tab, depth: navDepth, sheet: 1 }, ''); }
    return;
  }
  if (!$('#overlay').hidden) { closeSheet(true); return; }   // otvoren prozor -> samo ga zatvori
  const st = e.state || { tab: 'pregled', depth: 0 };
  navDepth = st.depth || 0;
  if (user && profile) go(st.tab || 'pregled', true);
});

function progress(s, b, slim){
  const p = Math.min(100, s / b * 100);
  const cls = s > b ? 'over' : p > 80 ? 'near' : '';
  return `<div class="bar ${cls}"><i style="width:${p.toFixed(1)}%"></i></div>` +
    (slim ? '' : `<p class="small muted">${s > b ? 'Prekoračeno za ' + eur.format(s - b) : 'Ostalo ' + eur.format(b - s)}</p>`);
}

// ---------------- SKENIRANJE QR KODA S FISKALNOG RAČUNA ----------------
// QR kod hrvatskog fiskalnog računa sadrži link tipa:
// https://porezna.gov.hr/rn?jir=...&datv=20261031_1730&izn=1234  (izn = iznos u centima)
let qr = null, lastBadQr = '';
function parseFiscalQr(text){
  try {
    const p = new URL(String(text).trim()).searchParams;
    const izn = p.get('izn'), datv = p.get('datv');
    if (!izn) return null;
    const amount = /[.,]/.test(izn) ? parseAmount(izn) : Math.round(Number(izn)) / 100;
    let date = null;
    const m = (datv || '').match(/^(\d{4})(\d{2})(\d{2})/);
    if (m) date = `${m[1]}-${m[2]}-${m[3]}`;
    return amount > 0 ? { amount, date } : null;
  } catch (e) { return null; }
}
async function startScan(){
  syncDraft();
  if (typeof Html5Qrcode === 'undefined') return toast('Skener se nije učitao – provjeri internet');
  lastBadQr = '';
  openSheet(`<h2>Skeniraj račun</h2>
    <p class="muted small">Usmjeri kameru na QR kod na dnu računa.</p>
    <div id="reader"></div>
    <label class="btn">🖼️ Odaberi sliku računa<input type="file" accept="image/*" hidden onchange="scanFile(this)"></label>
    <button class="btn link" onclick="cancelScan()">Odustani</button>`);
  qr = new Html5Qrcode('reader');
  try {
    await qr.start({ facingMode: 'environment' },
      { fps: 10, qrbox: (w, h) => { const s = Math.floor(Math.min(w, h) * 0.75); return { width: s, height: s }; } },
      onQr, () => {});
  } catch (e) {
    toast('Kamera nije dostupna – odaberi sliku računa');
  }
}
function onQr(text){
  const r = parseFiscalQr(text);
  if (!r) { if (text !== lastBadQr) { lastBadQr = text; toast('Ovo nije QR kod fiskalnog računa'); } return; }
  applyQr(r);
}
async function scanFile(input){
  const f = input.files && input.files[0]; if (!f) return;
  try {
    if (qr && qr.isScanning) await qr.stop();
    if (!qr) qr = new Html5Qrcode('reader');
    const text = await qr.scanFile(f, false);
    const r = parseFiscalQr(text);
    if (!r) return toast('Na slici nije pronađen QR kod fiskalnog računa');
    applyQr(r);
  } catch (e) {
    toast('QR kod nije pronađen na slici – probaj oštriju sliku');
  }
}
async function applyQr(r){
  await stopScan();
  draft.amount = r.amount.toFixed(2).replace('.', ',');
  if (r.date) draft.date = r.date;
  showTxSheet();
  toast('Iznos i datum preuzeti s računa – odaberi kategoriju');
}
async function stopScan(){
  const q = qr; qr = null;
  if (!q) return;
  try { if (q.isScanning) await q.stop(); q.clear(); } catch (e) {}
}
async function cancelScan(){ await stopScan(); showTxSheet(); }
function syncDraft(){
  draft.amount = $('#fAmt').value; draft.date = $('#fDate').value; draft.note = $('#fNote').value;
  const tg = $('#fTag'); if (tg && tg.value.trim()) { draft.tags = [...new Set([...(draft.tags || []), tg.value.trim().replace(/^#/, '').toLowerCase().slice(0, 30)])]; tg.value = ''; }
  const s = $('#fShared'); if (s) draft.is_shared = s.checked;
}
function setKind(k){
  syncDraft(); draft.kind = k; draft.category_id = null; if (k !== 'expense') draft.is_shared = false;
  if (k === 'transfer') {
    draft.account_id = primaryAcc();
    let to = null; try { to = localStorage.getItem('lastTo'); } catch (e) {}
    draft.to_account_id = activeAccs().some(a => a.id === to) && to !== draft.account_id ? to : null;
  } else if (!draft.id) draft.account_id = defaultAcc();
  showTxSheet();
}
function pickCat(id, el){
  draft.category_id = id;
  document.querySelectorAll('#catChips .chip').forEach(b => b.classList.remove('on'));
  el.classList.add('on');
}
async function saveTx(){
  syncDraft();
  const a = parseAmount(draft.amount);
  if (!(a > 0)) return toast('Upiši iznos');
  let row;
  if (draft.kind === 'transfer') {
    if (!draft.account_id || !draft.to_account_id || draft.account_id === draft.to_account_id) return toast('Odaberi dva različita računa');
    row = { kind: 'transfer', amount: a, category_id: null, account_id: draft.account_id, to_account_id: draft.to_account_id,
      date: draft.date || iso(new Date()), note: (draft.note || '').trim() || null, is_shared: false };
    try { localStorage.setItem('lastTo', draft.to_account_id); } catch (e) {}
  } else {
    if (!draft.category_id) return toast('Odaberi kategoriju');
    row = { kind: draft.kind, amount: a, category_id: draft.category_id, date: draft.date || iso(new Date()),
      note: (draft.note || '').trim() || null, is_shared: draft.kind === 'expense' && !!draft.is_shared && !isJoint(accById(draft.account_id)) };
    if (accounts.length) { row.account_id = draft.account_id || primaryAcc(); row.to_account_id = null; }
    try { if (row.account_id) localStorage.setItem('lastAcc', row.account_id); } catch (e) {}
    if (!draft.id && row.category_id) catUse[row.category_id] = (catUse[row.category_id] || 0) + 1;
    if (v10) row.tags = draft.tags && draft.tags.length ? draft.tags : null;
  }
  const q = draft.id ? sb.from('transactions').update(row).eq('id', draft.id) : sb.from('transactions').insert(row);
  const { error } = await q;
  if (error) return toast(error.message);
  closeSheet(); toast('Spremljeno');
  if (row.tags) loadTags();
  const [y, m] = row.date.split('-').map(Number);
  month = new Date(y, m - 1, 1);
  await loadMonth(); render();
}
async function delTx(){
  if (!confirm('Obrisati ovaj unos?')) return;
  const { error } = await sb.from('transactions').delete().eq('id', draft.id);
  if (error) return toast(error.message);
  closeSheet(); await loadMonth(); render();
}

// ---------------- OSTALO ----------------
function openSheet(h){
  const wasOpen = !$('#overlay').hidden;
  $('#sheet').innerHTML = '<div class="grab"></div>' + h; $('#overlay').hidden = false;
  if (!wasOpen) {
    if (ignorePop) pendingSheetPush = true;
    else history.pushState({ tab, depth: navDepth, sheet: 1 }, '');
  }
}
function closeSheet(fromHistory){
  if (qr) stopScan();
  const wasOpen = !$('#overlay').hidden;
  $('#overlay').hidden = true; $('#sheet').innerHTML = '';
  if (wasOpen && !fromHistory) {
    if (pendingSheetPush) pendingSheetPush = false;
    else if (history.state && history.state.sheet) { ignorePop = true; history.back(); }
  }
}

async function exportCsv(){
  const { data, error } = await sb.from('transactions').select('*').eq('user_id', user.id).order('date');
  if (error) return toast(error.message);
  const kinds = { expense: 'Trošak', income: 'Prihod', settlement: 'Podmirenje', transfer: 'Prijenos' };
  const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const lines = [['Datum', 'Vrsta', 'Kategorija', 'Iznos', 'Račun', 'Na račun', 'Bilješka', 'Zajedničko'].map(q).join(';')];
  for (const t of data) {
    const c = catById(t.category_id);
    const an = id => (accById(id) || {}).name || '';
    lines.push([t.date, kinds[t.kind], c ? c.name : '', String(t.amount).replace('.', ','), an(t.account_id), an(t.to_account_id), t.note || '', t.is_shared ? 'da' : 'ne'].map(q).join(';'));
  }
  const blob = new Blob(['\ufeff' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = `financije-${iso(new Date())}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
}
async function logout(){ await sb.auth.signOut(); user = null; profile = null; partner = null; showAuth(); }

// provjera nove verzije: ako je na GitHubu novija, osvježi aplikaciju
async function checkUpdate(){
  try {
    const r = await fetch(location.pathname + '?nocache=' + Date.now(), { cache: 'no-store' });
    const m = (await r.text()).match(/const VERSION = '([^']+)'/);
    if (m && m[1] !== VERSION && !sessionStorage.getItem('upd-' + m[1])) {
      sessionStorage.setItem('upd-' + m[1], '1');
      location.replace(location.pathname + '?v=' + encodeURIComponent(m[1]));
    }
  } catch (e) {}
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkUpdate(); });
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
initTip();
init();
checkUpdate();
</script>
